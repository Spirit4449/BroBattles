name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --prefix spritesheet-generator ci
      - run: npm run lint
      - run: npm test
      - name: Keep Map Studio publications outside Git
        run: test -z "$(git ls-files -- data/maps/)"
      - name: Check generated game defaults
        run: node scripts/dev/print-constants.cjs --check
      - run: npm run validate:content
      - run: npm run build
