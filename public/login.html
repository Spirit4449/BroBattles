<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="shortcut icon" href="/assets/logos/logo-small.webp" type="image/webp" />
    <link rel="stylesheet" href="/bundles/login.css" />
    <link rel="stylesheet" href="/styles/ui-system.css" />
  </head>
  <body class="site-auth">
<header class="site-header"><div class="site-brand"><span class="site-menu-placeholder" aria-hidden="true"></span><a href="/" class="lobby-wordmark"><img src="/assets/logos/wordmark.webp" width="176" height="36" alt="Bro Battles"/></a></div><nav class="site-desktop-nav" aria-label="Main navigation"><div class="site-nav-group "><a href="/about" >About</a><button type="button" aria-label="Expand About" aria-expanded="false">⌄</button><div class="site-nav-sub" hidden><a href="/about">Discover the game</a><a href="/about#modes">Game modes</a><a href="/about#fighters">Meet the fighters</a></div></div><div class="site-nav-group "><a href="/news" >News</a><button type="button" aria-label="Expand News" aria-expanded="false">⌄</button><div class="site-nav-sub" hidden><a href="/news">Latest stories</a><a href="/news/welcome-to-beta">Welcome to beta</a></div></div><div class="site-nav-group "><a href="/help" >Help Center</a><button type="button" aria-label="Expand Help Center" aria-expanded="false">⌄</button><div class="site-nav-sub" hidden><a href="/help">Browse answers</a><a href="/help/contact">Contact us</a><a href="/help/requests">My requests</a></div></div><div class="site-nav-group "><a href="/feedback" >Feedback</a><button type="button" aria-label="Expand Feedback" aria-expanded="false">⌄</button><div class="site-nav-sub" hidden><a href="/feedback">Send an idea</a><a href="/feedback">Report a bug</a></div></div></nav><a class="pixel-menu-button site-play" href="/">Play now</a><div class="site-account"><a class="pixel-menu-button" href="/login">Log in</a></div></header>
    <div class="container">
      <div class="auth-card">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to continue your adventure</p>

        <form id="loginForm">
          <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-input"
              placeholder="Enter your username"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>

          <button
            type="submit"
            class="auth-button pixel-menu-button"
            id="loginBtn"
          >
            <div class="button-content">
              <div class="loading" id="loading"></div>
              <span id="buttonText">Login</span>
            </div>
          </button>

          <div class="error-message" id="errorMessage"></div>
          <div class="success-message" id="successMessage"></div>
        </form>

        <div class="link-section">
          <a href="/signup" class="auth-link pixel-menu-button"
            >Sign up instead</a
          >
          <a href="/" class="back-link pixel-menu-button">Back to lobby</a>
        </div>
      </div>
    </div>
    <script src="/bundles/login.bundle.js"></script>
  </body>
</html>
