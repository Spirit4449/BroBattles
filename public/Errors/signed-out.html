<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signed Out · Bro Battles</title>
    <link rel="shortcut icon" href="/assets/sword.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/ui-system.css" />
    <link rel="stylesheet" href="/styles/status-pages.css" />
  </head>
  <body class="status-page">
    <main class="status-card">
      <img class="status-logo" src="/assets/sword.svg" alt="" />
      <h1 class="status-title">You Signed Out</h1>
      <p class="status-copy">Your session has ended. You can return as a guest or sign back in.</p>
      <div class="status-actions">
        <a class="status-action secondary" href="/">Return Home</a>
        <a class="status-action" href="/login">Log In</a>
        <a class="status-action success" href="/signup">Sign Up</a>
      </div>
    </main>
    <script>
      fetch("/logout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
      }).catch((error) => console.error("Error:", error));
    </script>
  </body>
</html>
