<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Banned · Bro Battles</title>
    <link rel="shortcut icon" href="/assets/sword.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/ui-system.css" />
    <link rel="stylesheet" href="/styles/status-pages.css" />
  </head>
  <body class="status-page banned-page">
    <main class="status-card">
      <img class="status-logo" src="/assets/sword.svg" alt="" />
      <h1 class="status-title">Account Banned</h1>
      <p class="status-copy">Access to this account has been restricted.</p>
      <section class="status-detail" id="banReason">Reason unavailable.</section>
      <p class="status-copy">If this is an error, contact support and include the reason shown above.</p>
    </main>
    <script>
      (function () {
        function getCookie(name) {
          const key = `${encodeURIComponent(name)}=`;
          const parts = document.cookie ? document.cookie.split(";") : [];
          for (const part of parts) {
            const trimmed = part.trim();
            if (trimmed.startsWith(key)) {
              return decodeURIComponent(trimmed.slice(key.length));
            }
          }
          return "";
        }

        const reason = getCookie("bb_ban_reason") || "Abuse policy violation.";
        const reasonEl = document.getElementById("banReason");
        if (reasonEl) reasonEl.textContent = reason;
      })();
    </script>
  </body>
</html>
