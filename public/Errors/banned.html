<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Banned · Bro Battles</title>
    <link rel="shortcut icon" href="/assets/logos/logo-small.webp" type="image/webp" />
    <link rel="stylesheet" href="/styles/lato.css" />
    <link rel="stylesheet" href="/styles/ui-system.css" />
    <link rel="stylesheet" href="/styles/status-pages.css" />
  </head>
  <body class="status-page banned-page">
    <main class="status-card">
      <img class="status-logo" src="/assets/logos/logo-large.webp" alt="" />
      <h1 class="status-title" id="banTitle">Account Banned</h1>
      <p class="status-copy">This account cannot enter the lobby or play. You can still contact support and read replies while signed in.</p>
      <section class="ban-countdown" id="banCountdown" hidden aria-label="Suspension countdown">
        <div id="banClock" aria-hidden="true"></div>
        <div class="ban-countdown-copy">
          <strong id="banRemaining" role="timer" aria-live="off"></strong>
        </div>
      </section>
      <section class="status-detail" aria-labelledby="banReasonLabel">
        <h2 class="restriction-label" id="banReasonLabel">Reason</h2>
        <p id="banReason">Reason unavailable.</p>
      </section>
      <nav class="status-actions" aria-label="Account support">
        <a class="status-action" href="/help/contact">Contact Support</a>
        <a class="status-action secondary" href="/help">Help Center</a>
      </nav>
    </main>
    <script type="module" src="/scripts/banned.js"></script>
  </body>
</html>
