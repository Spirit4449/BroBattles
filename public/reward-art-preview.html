<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reward artwork review</title><link rel="stylesheet" href="/styles/ui-system.css"><style>
*{box-sizing:border-box}body{margin:0;background:#091322;color:#e9f2ff;font:16px system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:32px 24px}h1{font-size:28px;color:#ffe08a}h2{margin-top:36px}p{color:#a8b9cf;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}.art{display:flex;flex-direction:column;align-items:center;gap:16px;background:#101f34;border:2px solid #344e6f;border-radius:8px;padding:20px;color:inherit;font:inherit;cursor:zoom-in}.art img{width:100%;height:150px;object-fit:contain;image-rendering:pixelated}.originals{display:flex;gap:28px}.originals img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated}dialog{background:#101f34;border:2px solid #e0b85d;color:white;max-width:90vw;max-height:94vh;padding:24px;text-align:center}dialog::backdrop{background:#030711da}dialog img{display:block;width:min(600px,75vw);height:min(550px,65vh);object-fit:contain;image-rendering:pixelated}dialog button{margin-top:20px;padding:12px 36px;background:#2d77b4;color:white;border:3px solid #080d18;font:inherit;cursor:pointer}a{color:#80c9ff}
</style></head><body><main><h1>Reward artwork review</h1><p>The original coin and gem are the design references. Select any illustration to inspect it.</p><div class="originals"><img src="/assets/coin.webp" alt="Original coin"><img src="/assets/gem.webp" alt="Original gem"></div><h2>Coins</h2><div id="coins" class="grid"></div><h2>Gems</h2><div id="gems" class="grid"></div><h2>Milestone bundles</h2><div id="bundles" class="grid"></div><p><a href="/reward-sound-preview.html">Listen to the reward sound samples</a></p></main><dialog id="detail"><h2 id="detail-title"></h2><img id="detail-art" alt=""><button id="close">Close</button></dialog><script>
const dialog=document.getElementById('detail');function add(group,title,path){const button=document.createElement('button');button.className='art';const img=document.createElement('img');img.src=path;img.alt=title;const text=document.createElement('span');text.textContent=title;button.append(img,text);button.onclick=()=>{document.getElementById('detail-title').textContent=title;const large=document.getElementById('detail-art');large.src=path;large.alt=title;dialog.showModal()};document.getElementById(group).append(button)}
for(const type of ['coins','gems'])for(const [level,label]of [['small',type==='coins'?'Small stack':'Small cluster'],['stack','Treasure pile'],['bag','Overflowing bag'],['chest','Treasure chest'],['chests','Two chests'],['cart','Treasure cart']])add(type,label,`/assets/currency/${type}-${level}.webp`);
for(const [id,title]of [[100,'Capture the Flag'],[250,'Bank Bust'],[500,'500 trophies'],[750,'Airdrop'],[1000,'1,000 trophies'],[1500,'Soccer'],[2500,'Bedwars'],[5000,'5,000 trophies'],[7500,'7,500 trophies'],[10000,'Arena Legend']])add('bundles',title,`/assets/reward-bundles/milestone-${id}.webp`);
document.getElementById('close').onclick=()=>dialog.close();
</script></body></html>
