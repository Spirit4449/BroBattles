<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map Studio · Bro Battles</title><link rel="stylesheet" href="/bundles/mapEditor.css"></head>
<body><div id="studio">
<header class="toolbar"><a href="/" class="brand" title="Return to lobby">BB<span>MAP STUDIO</span></a><select id="map-select" aria-label="Map"></select><select id="variant" aria-label="Team size variant"><option>1v1</option><option>2v2</option><option>3v3</option></select><span class="separator"></span><button id="undo" title="Undo (⌘/Ctrl Z)" aria-label="Undo"><svg viewBox="0 0 24 24" class="ui-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5 4 10l5 5M4 10h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></svg></button><button id="redo" title="Redo (⌘/Ctrl Shift Z)" aria-label="Redo"><svg viewBox="0 0 24 24" class="ui-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 5 5-5 5m5-5H10a6 6 0 0 0 0 12" transform="translate(0 -2)"/></svg></button><span id="save-state">Loading…</span><span class="spacer"></span><select id="playtest-kind" aria-label="Playtest opponents"><option value="solo">Solo</option><option value="bots">With bots</option></select><select id="playtest-character" aria-label="Playtest character"><option>ninja</option><option>thorg</option><option>draven</option><option>wizard</option><option>huntress</option><option>gloop</option></select><button id="preview"><svg viewBox="0 0 24 24" class="ui-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m8 4 12 8-12 8z"/></svg>Playtest <kbd>Esc</kbd></button><button id="export">Export</button><button id="import">Import</button><button id="save" class="primary">Save map</button></header>
<aside class="browser"><div class="pane-title">OBJECTS <span id="object-count"></span></div><input id="search" type="search" placeholder="Find an object…" aria-label="Search objects"><div class="add-row"><select id="add-kind" aria-label="Object type"><option value="platform">Platform</option><option value="hitbox">Collision box</option><option value="powerup">Powerup spawn</option><option value="goldMine">Gold mine</option><option value="claimableTurret">Turret</option><option value="wallSlot">Wall slot</option><option value="gold">Gold spawn</option></select><button id="add" class="primary" title="Add object" aria-label="Add object"><svg viewBox="0 0 24 24" class="ui-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button></div><label class="check"><input type="checkbox" id="all-spawns">All spawn formations</label><div id="object-list"></div><div class="browser-footer"><button id="new-map">＋ New map</button><button id="copy-variant">Copy variant…</button></div></aside>
<main id="viewport"><div id="canvas"></div><div id="marker-layer" aria-hidden="true"></div><div class="canvas-tools"><button id="fit" title="Fit world (F)" aria-label="Fit world"><svg viewBox="0 0 24 24" class="ui-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg> Fit</button><button id="zoom-out" aria-label="Zoom out"><svg viewBox="0 0 24 24" class="ui-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><span id="zoom-label">100%</span><button id="zoom-in" aria-label="Zoom in"><svg viewBox="0 0 24 24" class="ui-icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button><label>Snap <select id="grid"><option value="8">8 px</option><option value="16" selected>16 px</option><option value="32">32 px</option><option value="64">64 px</option><option value="0">Off</option></select></label></div><div id="canvas-hint">Shift-click to multi-select · Drag empty space to select an area · Space + drag to pan</div></main>
<aside class="inspector"><nav><button data-tab="selection" class="active">Inspector</button><button data-tab="world">World</button><button data-tab="assets">Assets</button></nav><div id="inspector-content"></div></aside>
<footer><span id="status" role="status" aria-live="polite">Opening map…</span><span>⌘/Ctrl Z undo · Shift Z redo · D duplicate · Delete remove · Esc playtest</span></footer>
</div><dialog id="dialog"><form method="dialog"><header><h2 id="dialog-title"></h2><button value="cancel" aria-label="Close">×</button></header><div id="dialog-content"></div><div class="dialog-actions"><button value="cancel">Cancel</button><button id="dialog-apply" value="default" class="primary">Apply</button></div></form></dialog><script src="/bundles/mapEditor.bundle.js"></script></body></html>
